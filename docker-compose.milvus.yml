# Milvus 3.0 standalone + Attu para ZoniaChatBot.
# Solo la base vectorial: Python y Angular corren en el host.
#
#   Levantar:  docker compose -f docker-compose.milvus.yml up -d
#   Estado:    docker compose -f docker-compose.milvus.yml ps
#   Logs:      docker compose -f docker-compose.milvus.yml logs -f standalone
#   Parar:     docker compose -f docker-compose.milvus.yml stop
#
# Milvus standalone NO es un solo contenedor: necesita etcd (metadatos) y
# MinIO (almacenamiento de objetos). Por eso el servicio suelto del
# docker-compose.yml original nunca llego a arrancar.
#
# Versiones alineadas: Milvus 3.0.0 <-> pymilvus 3.0.1 <-> Attu 3.0.0
# (Attu 3.x NO soporta Milvus 2.5 o anterior; para 2.5.x haria falta Attu 2.5.10)

services:
  etcd:
    container_name: zonia-milvus-etcd
    restart: unless-stopped
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: zonia-milvus-minio
    restart: unless-stopped
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"   # consola web: http://localhost:9001 (minioadmin/minioadmin)
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: zonia-milvus
    restart: unless-stopped
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC: el que usa pymilvus (config_process.yaml)
      - "9091:9091"     # metricas / healthz
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  attu:
    container_name: zonia-attu
    restart: unless-stopped
    image: zilliz/attu:v3.0.0
    ports:
      - "127.0.0.1:3000:3000"           # GUI: http://localhost:3000 (solo esta maquina)
    environment:
      MILVUS_ADDRESS: standalone:19530  # nombre del servicio, NO localhost
      ATTU_AUTH_MODE: none              # sin login: solo escucha en 127.0.0.1
    volumes:
      - attu_data:/data
    depends_on:
      standalone:
        condition: service_healthy

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  attu_data:
